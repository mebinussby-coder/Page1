<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Formulir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.20.0/lib/msal-browser.min.js"></script>
<style>
:root{--side:#0f2a3d;--side2:#17384f;--acc:#f2a900;--bg:#eceff3;--card:#fff;--ink:#1b2733;--mute:#66768a;--line:#dbe1e8;--ok:#1d7a4d;--okbg:#e0f2e8;--lock:#8a5a00;--lockbg:#fdf0d0;--r:6px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;display:flex}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
aside{width:232px;background:var(--side);color:#cfdbe6;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 20px;font-weight:700;font-size:16px;color:#fff;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--side2)}
.logo{width:28px;height:28px;border-radius:5px;background:var(--acc);color:var(--side);display:grid;place-items:center;font-weight:700}
nav{padding:12px 10px;flex:1}
nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:var(--r);color:inherit;text-decoration:none;margin-bottom:2px}
nav a:hover{background:var(--side2)}
nav a.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
nav .grp{padding:14px 12px 4px;font-size:12px;color:#7f93a6}
.side-foot{padding:14px 20px;font-size:12px;color:#7f93a6;border-top:1px solid var(--side2)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px}
header h1{font-size:17px;margin:0;flex:1}
.menu{display:none;background:none;border:0;font-size:20px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:var(--r);font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--side)}
.btn.pri{background:var(--side);border-color:var(--side);color:#fff}
.btn.pri:hover{background:var(--side2)}
.user{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--side);display:grid;place-items:center;font-weight:700}
.user small{display:block;color:var(--mute);line-height:1.2}
.user b{display:block;line-height:1.2}
#view{padding:24px;overflow:auto;flex:1}
.banner{background:var(--lockbg);color:var(--lock);padding:9px 24px;font-size:13px;border-bottom:1px solid #ecd9a0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-left:4px solid var(--side)}
.stat:nth-child(2){border-left-color:var(--ok)}.stat:nth-child(3){border-left-color:var(--acc)}
.stat b{font-size:26px;display:block;line-height:1.2}
.stat span{color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px}
.panel>h2{margin:0;padding:13px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tools input,.tools select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);font:inherit;background:#fff}
.tools input{flex:1;min-width:180px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mute);padding:9px 16px;background:#f6f8fa;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f9fafc}
td .t{font-weight:600}td .d{color:var(--mute);font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.g{background:var(--okbg);color:var(--ok)}.chip.l{background:var(--lockbg);color:var(--lock)}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
.gate{max-width:440px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center}
.gate h2{margin:0 0 8px}.gate p{color:var(--mute);margin:0 0 18px}
.ms{display:inline-flex;gap:9px;align-items:center}
.ms i{display:grid;grid-template-columns:repeat(2,8px);gap:2px}.ms i s{display:block;width:8px;height:8px}
.prose{padding:16px;max-width:70ch}.prose li{margin-bottom:6px}
@media(max-width:820px){aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.menu{display:block}#view{padding:14px}header{padding:10px 14px}.user small,.user b{display:none}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">F</div><span id="appName"></span></div>
  <nav id="nav"></nav>
  <div class="side-foot" id="orgName"></div>
</aside>
<main>
  <header>
    <button class="menu" id="menu" aria-label="Buka menu">☰</button>
    <h1 id="title">Dasbor</h1>
    <div id="auth"></div>
  </header>
  <div id="banner"></div>
  <div id="view"></div>
</main>

<script>
/* ============ KONFIGURASI: edit bagian ini saja ============ */
const CONFIG = {
  appName: "Portal Formulir",
  orgName: "Nama Organisasi Anda",
  msal: {
    clientId: "GANTI-DENGAN-APPLICATION-CLIENT-ID",
    tenantId: "GANTI-DENGAN-TENANT-ID",   // atau "organizations" agar semua akun kantor/sekolah bisa masuk
    // Harus sama persis dengan Redirect URI (tipe SPA) di Entra ID, contoh:
    // https://username.github.io/nama-repo/
    redirectUri: window.location.origin + window.location.pathname
  },
  // Kosongkan [] untuk mengizinkan semua akun dari tenant. Contoh: ["perusahaan.co.id"]
  allowedDomains: [],
  // access: "guest" = terbuka tanpa login, "login" = wajib login Microsoft
  forms: [
    { title: "Permintaan Perbaikan (Work Request)", category: "Pemeliharaan", access: "login", url: "https://forms.office.com/r/GANTI1", desc: "Laporkan kerusakan atau permintaan perbaikan aset." },
    { title: "Laporan Inspeksi Harian", category: "Pemeliharaan", access: "login", url: "https://forms.office.com/r/GANTI2", desc: "Checklist inspeksi rutin peralatan." },
    { title: "Permintaan Suku Cadang", category: "Gudang", access: "login", url: "https://forms.office.com/r/GANTI3", desc: "Ajukan kebutuhan suku cadang dan material." },
    { title: "Laporan Insiden K3", category: "K3", access: "login", url: "https://forms.office.com/r/GANTI4", desc: "Catat kejadian hampir celaka atau kecelakaan kerja." },
    { title: "Pendaftaran Tamu", category: "Umum", access: "guest", url: "https://forms.office.com/r/GANTI5", desc: "Isi data kunjungan sebelum memasuki area." },
    { title: "Survei Kepuasan Layanan", category: "Umum", access: "guest", url: "https://forms.office.com/r/GANTI6", desc: "Berikan penilaian atas layanan kami." },
    { title: "Laporan Keluhan atau Saran", category: "Umum", access: "guest", url: "https://forms.office.com/r/GANTI7", desc: "Sampaikan masukan tanpa perlu akun." }
  ]
};
/* ============================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const configured = !CONFIG.msal.clientId.startsWith("GANTI");
let app = null, user = null;

$("#appName").textContent = CONFIG.appName;
$("#orgName").textContent = CONFIG.orgName;
document.title = CONFIG.appName;

/* ---------- Autentikasi ---------- */
async function initAuth(){
  if(!configured){ setUser(JSON.parse(sessionStorage.getItem("demoUser") || "null")); return; }
  app = new window.msal.PublicClientApplication({
    auth:{ clientId:CONFIG.msal.clientId, authority:"https://login.microsoftonline.com/"+CONFIG.msal.tenantId, redirectUri:CONFIG.msal.redirectUri },
    cache:{ cacheLocation:"localStorage" }
  });
  await app.initialize();
  const res = await app.handleRedirectPromise().catch(e=>console.error(e));
  const acc = (res && res.account) || app.getAllAccounts()[0];
  if(acc) accept(acc);
}
function accept(acc){
  const mail = (acc.username || "").toLowerCase();
  const ok = !CONFIG.allowedDomains.length || CONFIG.allowedDomains.some(d => mail.endsWith("@"+d.toLowerCase()));
  if(!ok){ alert("Akun "+mail+" tidak diizinkan. Gunakan akun dari domain organisasi."); app.logoutPopup({account:acc}); return; }
  setUser({ name: acc.name || mail, email: mail });
}
async function login(){
  if(!configured){
    if(confirm("Client ID belum diisi, jadi login Microsoft belum aktif.\nMasuk sebagai akun demo untuk mencoba tampilan?")){
      const u={name:"Pengguna Demo",email:"demo@contoh.id"}; sessionStorage.setItem("demoUser",JSON.stringify(u)); setUser(u);
    }
    return;
  }
  try{ const r = await app.loginPopup({scopes:["User.Read"], prompt:"select_account"}); accept(r.account); }
  catch(e){ if(!String(e).includes("user_cancelled")) alert("Login gagal: "+(e.errorMessage||e)); }
}
function logout(){
  if(!configured){ sessionStorage.removeItem("demoUser"); setUser(null); return; }
  app.logoutPopup({account:app.getAllAccounts()[0], postLogoutRedirectUri:CONFIG.msal.redirectUri}).finally(()=>setUser(null));
}
function setUser(u){ user = u; renderChrome(); route(); }

/* ---------- Tampilan ---------- */
const PAGES = {
  dasbor:{label:"Dasbor", icon:"▦", need:true},
  formulir:{label:"Semua formulir", icon:"☰", need:true},
  tamu:{label:"Formulir tamu", icon:"◎", need:false},
  bantuan:{label:"Bantuan", icon:"?", need:false}
};
function renderChrome(){
  const cur = location.hash.slice(1) || "dasbor";
  $("#nav").innerHTML = `<div class="grp">Menu</div>` + ["dasbor","formulir"].map(k=>link(k,cur)).join("") +
    `<div class="grp">Akses publik</div>` + ["tamu","bantuan"].map(k=>link(k,cur)).join("");
  $("#auth").innerHTML = user
    ? `<div class="user"><div class="av">${esc(user.name[0].toUpperCase())}</div><div><b>${esc(user.name)}</b><small>${esc(user.email)}</small></div><button class="btn" onclick="logout()">Keluar</button></div>`
    : `<button class="btn pri ms" onclick="login()"><i><s style="background:#f25022"></s><s style="background:#7fba00"></s><s style="background:#00a4ef"></s><s style="background:#ffb900"></s></i>Masuk dengan Microsoft</button>`;
  $("#banner").innerHTML = configured ? "" : `<div class="banner">Mode demo: Client ID Microsoft belum diisi di CONFIG. Tombol masuk hanya mensimulasikan login.</div>`;
}
function link(k,cur){ const p=PAGES[k]; return `<a href="#${k}" class="${k===cur?"on":""}"><span>${p.icon}</span>${p.label}</a>`; }

function route(){
  const k = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : "dasbor";
  const p = PAGES[k];
  $("#title").textContent = p.label;
  $("#side").classList.remove("open");
  renderChrome();
  if(p.need && !user){ $("#view").innerHTML = gate(); return; }
  ({dasbor:viewDash, formulir:()=>viewForms("all"), tamu:()=>viewForms("guest"), bantuan:viewHelp})[k]();
}
function gate(){
  return `<div class="gate"><h2>Masuk untuk melanjutkan</h2><p>Halaman ini khusus pengguna organisasi. Masuk memakai akun Microsoft Anda, atau buka formulir tamu tanpa login.</p>
  <button class="btn pri" onclick="login()">Masuk dengan Microsoft</button> <a class="btn" href="#tamu" style="text-decoration:none;display:inline-block">Buka formulir tamu</a></div>`;
}
function viewDash(){
  const f = CONFIG.forms, g = f.filter(x=>x.access==="guest").length, cats = [...new Set(f.map(x=>x.category))];
  $("#view").innerHTML = `
  <div class="stats">
    <div class="stat"><b>${f.length}</b><span>Total formulir</span></div>
    <div class="stat"><b>${g}</b><span>Terbuka untuk tamu</span></div>
    <div class="stat"><b>${f.length-g}</b><span>Khusus login</span></div>
    <div class="stat"><b>${cats.length}</b><span>Kategori</span></div>
  </div>
  <div class="panel"><h2>Formulir yang sering dipakai</h2>${table(f.slice(0,5))}</div>`;
}
function viewForms(mode){
  const base = mode==="guest" ? CONFIG.forms.filter(x=>x.access==="guest") : CONFIG.forms;
  const cats = [...new Set(base.map(x=>x.category))];
  $("#view").innerHTML = `<div class="panel">
    <div class="tools"><input id="q" type="search" placeholder="Cari formulir" aria-label="Cari formulir">
    <select id="c" aria-label="Kategori"><option value="">Semua kategori</option>${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
    <div id="list"></div></div>`;
  const draw = () => {
    const q = $("#q").value.toLowerCase(), c = $("#c").value;
    $("#list").innerHTML = table(base.filter(x => (!c||x.category===c) && (x.title+x.desc).toLowerCase().includes(q)));
  };
  $("#q").oninput = draw; $("#c").onchange = draw; draw();
}
function table(rows){
  if(!rows.length) return `<div class="empty">Tidak ada formulir yang cocok. Ubah kata kunci atau pilih kategori lain.</div>`;
  return `<div class="tw"><table><thead><tr><th>Formulir</th><th>Kategori</th><th>Akses</th><th></th></tr></thead><tbody>` +
  rows.map(r=>{
    const i = CONFIG.forms.indexOf(r), locked = r.access==="login" && !user;
    return `<tr><td><div class="t">${esc(r.title)}</div><div class="d">${esc(r.desc)}</div></td><td>${esc(r.category)}</td>
    <td><span class="chip ${r.access==="guest"?"g":"l"}">${r.access==="guest"?"Tamu":"Login"}</span></td>
    <td style="text-align:right"><button class="btn ${locked?"":"pri"}" onclick="openForm(${i})">${locked?"Masuk dulu":"Isi formulir"}</button></td></tr>`;
  }).join("") + `</tbody></table></div>`;
}
function openForm(i){
  const f = CONFIG.forms[i];
  if(f.access==="login" && !user){ login(); return; }
  window.open(f.url, "_blank", "noopener");
}
function viewHelp(){
  $("#view").innerHTML = `<div class="panel"><h2>Cara memakai portal</h2><div class="prose"><ul>
  <li>Formulir bertanda <span class="chip g">Tamu</span> bisa dibuka siapa saja tanpa akun.</li>
  <li>Formulir bertanda <span class="chip l">Login</span> memerlukan akun Microsoft organisasi.</li>
  <li>Setiap formulir terbuka di tab baru dan jawaban tersimpan di Microsoft Forms.</li>
  <li>Kendala akses? Hubungi administrator organisasi Anda.</li></ul></div></div>`;
}

$("#menu").onclick = () => $("#side").classList.toggle("open");
addEventListener("hashchange", route);
initAuth().then(route).catch(e=>{console.error(e); route();});
</script>
</body>
</html>
