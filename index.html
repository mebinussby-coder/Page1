<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Formulir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mute:#627084;--line:#e2e6ec;--acc:#2456d6;--acc2:#1b44ae;--accbg:#e8eefc;--ok:#15714a;--okbg:#def3e8;--in:#7a4f00;--inbg:#fbefcf;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#171e28;--ink:#e8edf3;--mute:#92a0b3;--line:#273140;--acc:#6d93ff;--acc2:#8aa9ff;--accbg:#1d2a47;--ok:#6fd3a0;--okbg:#17372a;--in:#f0c768;--inbg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:10px;padding:18px 0;font-weight:700}
.mark{width:32px;height:32px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800}
.hero{padding:44px 0 26px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;letter-spacing:-.02em;margin:0 0 12px;font-weight:800;max-width:18ch}
.hero p{margin:0 0 24px;color:var(--mute);max-width:56ch;font-size:16px}
.search{position:relative;display:block;max-width:520px}
.search input{width:100%;padding:14px 16px 14px 44px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 18px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);padding:6px 14px;border-radius:99px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:none;color:var(--ink);padding:6px 13px;border-radius:99px;cursor:pointer}
.cats button[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc2);font-weight:600}
.count{color:var(--mute);margin-left:auto;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.ic{width:42px;height:42px;border-radius:10px;background:var(--accbg);display:grid;place-items:center;font-size:21px}
.card h2{font-size:16px;margin:0;line-height:1.3}
.card p{margin:0;color:var(--mute);font-size:14px;flex:1}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.tag{padding:2px 10px;border-radius:99px;font-weight:600}
.tag.u{background:var(--okbg);color:var(--ok)}.tag.i{background:var(--inbg);color:var(--in)}
.go{display:block;text-align:center;text-decoration:none;background:var(--acc);color:#fff;padding:10px;border-radius:9px;font-weight:600}
.go:hover{background:var(--acc2)}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
footer{border-top:1px solid var(--line);padding:22px 0 34px;color:var(--mute);font-size:13.5px}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="mark" id="mark"></div><span id="appName"></span></div>

  <section class="hero">
    <h1 id="heroTitle"></h1>
    <p id="heroText"></p>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari formulir, misalnya perbaikan atau tamu" aria-label="Cari formulir">
    </label>
  </section>

  <div class="bar">
    <div class="seg" id="seg" role="group" aria-label="Jenis akses">
      <button data-a="all" aria-pressed="true">Semua</button>
      <button data-a="umum" aria-pressed="false">Untuk umum</button>
      <button data-a="internal" aria-pressed="false">Internal</button>
    </div>
    <div class="cats" id="cats" role="group" aria-label="Kategori"></div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <main class="grid" id="grid"></main>

  <footer id="foot"></footer>
</div>

<script>
/* ============ KONFIGURASI: edit bagian ini saja ============ */
const CONFIG = {
  appName: "Portal Formulir",
  heroTitle: "Semua formulir kami, satu tempat",
  heroText: "Pilih formulir yang Anda butuhkan lalu klik Buka. Formulir internal akan meminta Anda masuk dengan akun Microsoft organisasi.",
  footer: "Kendala saat mengisi formulir? Hubungi admin di admin@contoh.id.",
  /* access: "umum" = bisa diisi siapa saja, "internal" = Microsoft Forms akan meminta akun organisasi */
  forms: [
    { title: "Permintaan Perbaikan", category: "Pemeliharaan", access: "internal", icon: "🛠️", url: "https://forms.office.com/r/GANTI1", desc: "Laporkan kerusakan atau ajukan permintaan perbaikan aset." },
    { title: "Laporan Inspeksi Harian", category: "Pemeliharaan", access: "internal", icon: "📋", url: "https://forms.office.com/r/GANTI2", desc: "Checklist inspeksi rutin untuk peralatan dan area kerja." },
    { title: "Permintaan Suku Cadang", category: "Gudang", access: "internal", icon: "📦", url: "https://forms.office.com/r/GANTI3", desc: "Ajukan kebutuhan suku cadang dan material." },
    { title: "Laporan Insiden K3", category: "K3", access: "internal", icon: "🦺", url: "https://forms.office.com/r/GANTI4", desc: "Catat kejadian hampir celaka atau kecelakaan kerja." },
    { title: "Pendaftaran Tamu", category: "Umum", access: "umum", icon: "🪪", url: "https://forms.office.com/r/GANTI5", desc: "Isi data kunjungan sebelum memasuki area." },
    { title: "Survei Kepuasan Layanan", category: "Umum", access: "umum", icon: "⭐", url: "https://forms.office.com/r/GANTI6", desc: "Beri tahu kami bagaimana pengalaman Anda." },
    { title: "Keluhan dan Saran", category: "Umum", access: "umum", icon: "💬", url: "https://forms.office.com/r/GANTI7", desc: "Sampaikan masukan tanpa perlu akun." }
  ]
};
/* ============================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = { q:"", a:"all", c:"" };

document.title = CONFIG.appName;
$("#appName").textContent = CONFIG.appName;
$("#mark").textContent = CONFIG.appName[0].toUpperCase();
$("#heroTitle").textContent = CONFIG.heroTitle;
$("#heroText").textContent = CONFIG.heroText;
$("#foot").textContent = CONFIG.footer;

function drawCats(){
  const cats = ["", ...new Set(CONFIG.forms.map(f => f.category))];
  $("#cats").innerHTML = cats.map(c => `<button data-c="${esc(c)}" aria-pressed="${st.c===c}">${c ? esc(c) : "Semua kategori"}</button>`).join("");
}
function draw(){
  const q = st.q.toLowerCase();
  const rows = CONFIG.forms.filter(f =>
    (st.a==="all" || f.access===st.a) &&
    (!st.c || f.category===st.c) &&
    (f.title+" "+f.desc+" "+f.category).toLowerCase().includes(q));
  $("#count").textContent = rows.length + " formulir";
  $("#grid").innerHTML = rows.length ? rows.map(f => `
    <article class="card">
      <div class="ic" aria-hidden="true">${f.icon || "📄"}</div>
      <h2>${esc(f.title)}</h2>
      <p>${esc(f.desc)}</p>
      <div class="meta"><span class="tag ${f.access==="umum"?"u":"i"}">${f.access==="umum"?"Untuk umum":"Akun organisasi"}</span><span>${esc(f.category)}</span></div>
      <a class="go" href="${esc(f.url)}" target="_blank" rel="noopener">Buka formulir</a>
    </article>`).join("")
    : `<div class="empty">Tidak ada formulir yang cocok. Ubah kata kunci atau pilih kategori lain.</div>`;
}
$("#q").oninput = e => { st.q = e.target.value; draw(); };
$("#seg").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  st.a = b.dataset.a;
  document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-pressed", x===b));
  draw();
};
$("#cats").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  st.c = b.dataset.c; drawCats(); draw();
};
drawCats(); draw();
</script>
</body>
</html>
